[project]
name = "recorder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.17.0",
    "humanize>=4.16.0",
    "playwright>=1.64.1",
    "pydantic-settings>=2.16.2",
    "python-dateutil>=3.0.0",
    "sortedcontainers>=2.4.0",
]

[project.scripts]
tv = "recorder.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
